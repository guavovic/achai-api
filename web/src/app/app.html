<div class="page">
  <header class="header">
    <div>
      <h1><app-logo [size]="44" /> Achaí</h1>
      <p class="tagline">Encontre qualquer endereço do Brasil pelo CEP ou pelo nome da rua.</p>
    </div>
    <nav class="actions" aria-label="Links e tema">
      <a
        class="icon-button"
        [href]="docsUrl"
        title="Documentação da API"
        aria-label="Documentação da API"
      >
        <svg lucideBookOpen size="20"></svg>
      </a>
      <a
        class="icon-button"
        href="https://github.com/guavovic/achai"
        title="Código no GitHub"
        aria-label="Código no GitHub"
      >
        <app-github-icon />
      </a>
      <button
        type="button"
        class="icon-button"
        (click)="theme.toggle()"
        [title]="themeAction()"
        [attr.aria-label]="themeAction()"
      >
        @if (theme.mode() === 'dark') {
          <svg lucideSun size="20"></svg>
        } @else {
          <svg lucideMoon size="20"></svg>
        }
      </button>
    </nav>
  </header>

  <main class="card">
    <div class="tabs" role="tablist" aria-label="Tipo de busca">
      <button
        type="button"
        role="tab"
        id="tab-cep"
        aria-controls="painel-cep"
        [attr.aria-selected]="tab() === 'zipCode'"
        (click)="tab.set('zipCode')"
      >
        <svg lucideMailbox size="18"></svg>
        Por CEP
      </button>
      <button
        type="button"
        role="tab"
        id="tab-endereco"
        aria-controls="painel-endereco"
        [attr.aria-selected]="tab() === 'street'"
        (click)="tab.set('street')"
      >
        <svg lucideSignpost size="18"></svg>
        Por endereço
      </button>
    </div>

    <div id="painel-cep" role="tabpanel" aria-labelledby="tab-cep" [hidden]="tab() !== 'zipCode'">
      <app-zip-code-search />
    </div>
    <div
      id="painel-endereco"
      role="tabpanel"
      aria-labelledby="tab-endereco"
      [hidden]="tab() !== 'street'"
    >
      <app-street-search />
    </div>
  </main>

  <app-search-results
    (zipCodeExample)="searchZipCodeExample($event)"
    (streetExample)="searchStreetExample($event)"
  />
</div>
