<div class="page">
  <header class="header">
    <div>
      <h1><app-logo [size]="44" /> Achaí</h1>
      <p class="tagline">Encontre qualquer endereço do Brasil pelo CEP ou pelo nome da rua.</p>
    </div>
    <button
      type="button"
      class="theme"
      (click)="theme.cycle()"
      [attr.aria-label]="'Tema: ' + themeLabel() + '. Clique para trocar.'"
    >
      @switch (theme.mode()) {
        @case ('light') {
          <svg lucideSun size="16"></svg>
        }
        @case ('dark') {
          <svg lucideMoon size="16"></svg>
        }
        @default {
          <svg lucideSunMoon size="16"></svg>
        }
      }
      {{ themeLabel() }}
    </button>
  </header>

  <main class="card">
    <div class="tabs" role="tablist" aria-label="Tipo de busca">
      <button
        type="button"
        role="tab"
        id="tab-cep"
        aria-controls="painel-cep"
        [attr.aria-selected]="tab() === 'zipCode'"
        (click)="tab.set('zipCode')"
      >
        <svg lucideMailbox size="18"></svg>
        Por CEP
      </button>
      <button
        type="button"
        role="tab"
        id="tab-endereco"
        aria-controls="painel-endereco"
        [attr.aria-selected]="tab() === 'street'"
        (click)="tab.set('street')"
      >
        <svg lucideSignpost size="18"></svg>
        Por endereço
      </button>
    </div>

    <!-- Os dois formulários ficam montados: trocar de aba não apaga o que foi digitado. -->
    <div id="painel-cep" role="tabpanel" aria-labelledby="tab-cep" [hidden]="tab() !== 'zipCode'">
      <app-zip-code-search />
    </div>
    <div
      id="painel-endereco"
      role="tabpanel"
      aria-labelledby="tab-endereco"
      [hidden]="tab() !== 'street'"
    >
      <app-street-search />
    </div>
  </main>

  <app-search-results
    (zipCodeExample)="searchZipCodeExample($event)"
    (streetExample)="searchStreetExample($event)"
  />

  <footer class="footer">
    <a [href]="docsUrl"><svg lucideBookOpen size="16"></svg> Documentação da API</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/guavovic/achai"
      ><svg lucideCodeXml size="16"></svg> Código no GitHub</a
    >
  </footer>
</div>
