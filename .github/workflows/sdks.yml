name: Publicar SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Versão dos pacotes (sem o v)
        required: true

permissions:
  contents: read

jobs:
  nuget:
    name: Publicar no NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Empacotar o cliente .NET
        run: dotnet pack sdk/dotnet/Achai.Client -c Release -p:Version="${VERSION#v}" -o nupkg

      - name: Entrar no NuGet com Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Enviar o pacote
        run: dotnet nuget push nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    name: Publicar no npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Atualizar o npm (Trusted Publishing pede 11.5.1 ou mais)
        run: npm install -g npm@latest

      - name: Publicar
        run: |
          export NODE_AUTH_TOKEN="$(printf '%s' "$NODE_AUTH_TOKEN" | tr -cd 'A-Za-z0-9_')"
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
